# Full stack: PostgreSQL + Redis + API + worker + beat (sweeper).
#   cp .env.example .env    # set WEBHOOK_SECRET
#   docker compose up --build
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://webhooks:webhooks@postgres:5432/webhooks
    CELERY_BROKER_URL: redis://redis:6379/0
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks   # local development only
      POSTGRES_DB: webhooks
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=4"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *app
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
